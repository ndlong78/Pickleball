# Local test project only. No remote project_ref or production credentials.
project_id = "pickleup-v6"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 200
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[storage]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:4173/Pickleball/"
additional_redirect_urls = ["http://127.0.0.1:4173/?auth_callback=1"]
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.magic_link]
subject = "PickleUp local OTP"
content_path = "./supabase/templates/otp.html"
