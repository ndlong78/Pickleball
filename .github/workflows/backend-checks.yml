name: Backend checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - 'modules/data/**'
      - 'tests/data-*'
      - 'tests/sync-*'
      - 'package.json'
      - '.github/workflows/backend-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Official images on Docker Hub; no cloud project or credentials.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install JS integration dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify SQL Editor upgrade matches migration source
        run: |
          python3 scripts/build_legacy_epoch_upgrade.py --check
          python3 scripts/build_lesson_domain_upgrade.py --check
          python3 scripts/build_advanced_levels_upgrade.py --check
          python3 scripts/build_account_deletion_upgrade.py --check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Start isolated local PostgreSQL, Auth and REST
        run: |
          # Capture local server startup errors before CLI cleanup removes a failed container.
          (
            until docker inspect supabase_db_pickleup-v6 >/dev/null 2>&1; do sleep 1; done
            exec docker logs --follow supabase_db_pickleup-v6
          ) > "$RUNNER_TEMP/pickleup-db-startup.log" 2>&1 &
          db_log_pid=$!
          trap 'kill "$db_log_pid" 2>/dev/null || true' EXIT
          if ! supabase start -x studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta > /dev/null; then
            tail -150 "$RUNNER_TEMP/pickleup-db-startup.log"
            exit 1
          fi
      - name: Upgrade schema-only fixture without losing rows or sync bootstrap
        run: |
          supabase db reset --local --version 20261029000100
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/upgrade_seed.sql
          supabase migration up --local
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/upgrade_verify.sql
      - name: Upgrade protocol1 receipts and existing manifest metadata
        run: |
          supabase db reset --local --version 20261029000200
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/import_upgrade_seed.sql
          supabase migration up --local
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/import_upgrade_verify.sql
      - name: Upgrade existing six-migration DB through reviewed SQL Editor bundle
        run: |
          supabase db reset --local --version 20261103000100
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/legacy_epoch_upgrade_seed.sql
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/manual/staging_upgrade_20261111000100.sql
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/legacy_epoch_upgrade_verify.sql
      - name: Upgrade existing seven-migration DB through the C3 lesson-domain SQL Editor bundle
        run: |
          supabase db reset --local --version 20261111000100
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/manual/staging_upgrade_20261114000100.sql
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/lesson_domain_upgrade_verify.sql
      - name: Upgrade existing eight-migration DB through the advanced-levels SQL Editor bundle
        run: |
          supabase db reset --local --version 20261114000100
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/manual/staging_upgrade_20261115000100.sql
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/advanced_levels_upgrade_verify.sql
      - name: Upgrade existing nine-migration DB through the account-deletion SQL Editor bundle
        run: |
          supabase db reset --local --version 20261115000100
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/manual/staging_upgrade_20261121000100.sql
          docker exec -i supabase_db_pickleup-v6 psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres < scripts/fixtures/account_deletion_upgrade_verify.sql
      - name: Verify migration reset from empty local DB
        run: supabase db reset --local
      - name: pgTAP schema, ownership, constraints and sync tests
        run: supabase test db
      - name: Real REST and concurrent transaction tests
        run: python3 scripts/test_backend.py
      - name: Atomic import REST, replay, ownership and concurrency
        run: python3 scripts/test_import.py
      - name: Fenced sender REST, CAS and restore lock race
        run: python3 scripts/test_sync.py
      - name: Activity events REST, append identity, ownership and epoch race
        run: python3 scripts/test_activity.py
      - name: Plan and selection REST, immutable snapshots, CAS and epoch race
        run: python3 scripts/test_plans.py
      - name: Encrypted backup script against local DB (decrypt, list, auth rows)
        run: |
          sudo apt-get install -y -qq age >/dev/null
          key="$RUNNER_TEMP/backup-key.txt"; age-keygen -o "$key" 2>/dev/null
          BACKUP_DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres' BACKUP_AGE_RECIPIENT="$(age-keygen -y "$key")" BACKUP_OUT_DIR="$RUNNER_TEMP/backup" bash scripts/backup_db.sh
          mkdir -p "$RUNNER_TEMP/restore" && age -d -i "$key" "$RUNNER_TEMP"/backup/*.tar.age | tar -C "$RUNNER_TEMP/restore" -xf -
          docker run --rm -v "$RUNNER_TEMP/restore:/r" postgres:17 sh -c 'pg_restore --list /r/data.dump | grep -q "TABLE DATA public user_preferences" && pg_restore --list /r/data.dump | grep -q "TABLE DATA pickleup_private sync_changes" && pg_restore --list /r/auth.dump | grep -q "TABLE DATA auth users" && pg_restore --list /r/auth.dump | grep -q "TABLE DATA auth identities"'
          grep -q 'db-backup-v1' "$RUNNER_TEMP/restore/manifest.json"
          rm -rf "$RUNNER_TEMP/backup" "$RUNNER_TEMP/restore" "$key"
      - name: Real OTP, email capture, refresh and private RPC
        run: python3 scripts/test_auth.py
      - name: Install real Auth browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Real browser OTP, import resume and account isolation
        env:
          # Disable Playwright protocol logging; the runner emits phase enums only.
          DEBUG: ""
        run: npm run test:auth:browser
      - name: Restore drill on local Supabase (backup, reset, restore, compare row counts)
        run: |
          db='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          key="$RUNNER_TEMP/drill-key.txt"; age-keygen -o "$key" 2>/dev/null
          docker run --rm --network host -v "$PWD/scripts:/s:ro" postgres:17 psql "$db" -X -At -F '|' -v ON_ERROR_STOP=1 -f /s/db_row_counts.sql > "$RUNNER_TEMP/source-counts"
          cat "$RUNNER_TEMP/source-counts"
          # The drill is only meaningful with real Auth users and app rows from the suites above.
          awk -F'|' '$1=="auth.users"&&$2>0{u=1} $1!~/^auth\./&&$2>0{a++} END{exit !(u&&a>=3)}' "$RUNNER_TEMP/source-counts"
          BACKUP_DB_URL="$db" BACKUP_AGE_RECIPIENT="$(age-keygen -y "$key")" BACKUP_OUT_DIR="$RUNNER_TEMP/drill" bash scripts/backup_db.sh
          supabase db reset --local
          RESTORE_DB_URL="$db" RESTORE_BACKUP_FILE="$(ls "$RUNNER_TEMP"/drill/*.tar.age)" RESTORE_AGE_KEY="$key" RESTORE_EXPECT_COUNTS="$RUNNER_TEMP/source-counts" bash scripts/restore_db.sh
          rm -rf "$RUNNER_TEMP/drill" "$key" "$RUNNER_TEMP/source-counts"
      - name: Clean up local containers
        if: always()
        run: supabase stop --no-backup
