name: Responsive UI checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "modules/**"
      - "pages/**"
      - "sw.js"
      - "advanced-*.js"
      - "advanced.css"
      - "match-journal.js"
      - "curriculum.js"
      - "dashboard.js"
      - "responsive.css"
      - "mobile-ui.js"
      - "personalized-ui.js"
      - "practice-runner.js"
      - "training-log-core.js"
      - "training-evaluation-*.js"
      - "training-evaluation.css"
      - "practice-conditions.js"
      - "tactical-insights-*.js"
      - "match-journal.js"
      - "tests/**"
      - "package.json"
      - "playwright.config.cjs"
      - ".github/workflows/responsive.yml"
  workflow_dispatch:
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test runner
        run: npm install --no-audit --no-fund
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run JavaScript unit tests
        run: npm run test:unit
      - name: Run iPhone and iPad viewport smoke tests
        run: npm run test:responsive
      - name: Upload V3.8 browser benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pickleup-v38-browser-benchmark
          path: test-results/v38-browser-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pickleup-responsive-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
