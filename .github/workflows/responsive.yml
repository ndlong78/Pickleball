name: Responsive UI checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "modules/**"
      - "pages/**"
      - "sw.js"
      - "advanced-*.js"
      - "advanced.css"
      - "match-journal.js"
      - "curriculum.js"
      - "cms/**"
      - "scripts/check-content.cjs"
      - "dashboard.js"
      - "responsive.css"
      - "mobile-ui.js"
      - "personalized-ui.js"
      - "practice-runner.js"
      - "training-log-core.js"
      - "training-evaluation-*.js"
      - "training-evaluation.css"
      - "practice-conditions.js"
      - "tactical-insights-*.js"
      - "match-journal.js"
      - "tests/**"
      - "package.json"
      - "playwright.config.cjs"
      - "wrangler.jsonc"
      - "_redirects"
      - "scripts/build-cloudflare.cjs"
      - "scripts/serve_test.py"
      - "package-lock.json"
      - ".github/workflows/responsive.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify Node.js 24
        run: |
          node --version
          npm --version
          node -e 'if (process.versions.node.split(".")[0] !== "24") process.exit(1)'
      - name: Install test runner
        run: npm ci --no-audit --no-fund
      - name: Run JavaScript unit tests
        run: npm run test:unit
      - name: Validate Academy content against the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$RUNNER_TEMP/base-curriculum.js"
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git fetch --depth=1 origin "$BASE_SHA"; then
            git show FETCH_HEAD:curriculum.js > "$base" || rm -f "$base"
          fi
          node scripts/check-content.cjs --previous "$base"
      - name: Verify isolated static test host
        run: python3 -m unittest scripts/test_static_host.py
      - name: Validate Cloudflare static build without deployment
        run: npm run check:cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Verify local Workers Static Assets routing
        run: npm run test:cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Verify WebKit rescue hydration without retries
        run: npx playwright test tests/rescue.spec.cjs --project="WebKit responsive" --grep="raw rescue preserves legacy and excludes Auth at 390" --repeat-each=5 --retries=0
      - name: Verify optional font loading and navigation without retries
        run: npx playwright test tests/page-routing.spec.cjs --project="WebKit responsive" --grep="delayed optional font does not block" --repeat-each=5 --retries=0
      - name: Verify WebKit purge reload hydration without retries
        run: npx playwright test tests/account-purge.spec.cjs --project="WebKit responsive" --grep="own clean-cache purge 820" --repeat-each=10 --retries=0
      - name: Run iPhone and iPad viewport smoke tests
        run: npm run test:responsive
      - name: Verify WebKit Academy countdown without retries
        run: npx playwright test tests/v42-timer.spec.cjs --project="WebKit responsive" --grep="V4.2 focus countdown" --repeat-each=10 --retries=0
      - name: Verify WebKit Academy step reset without retries
        run: npx playwright test tests/v41-steps.spec.cjs --project="WebKit responsive" --repeat-each=10 --retries=0
      - name: Verify WebKit account switch and focus readiness without retries
        run: npx playwright test tests/academy-selection.spec.cjs tests/v42-focus.spec.cjs --project="WebKit responsive" --grep="A to B ignores late navigation|V4.2 focused drills 390" --repeat-each=10 --retries=0
      - name: Upload V3.8 browser benchmark
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pickleup-v38-browser-benchmark
          path: test-results/v38-browser-benchmark.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pickleup-responsive-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
